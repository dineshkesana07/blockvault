      uppercase: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
      lowercase: 'abcdefghijkmnopqrstuvwxyz',
      numbers: '23456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'

    const WORDLIST = [
      'cipher', 'quantum', 'argon', 'enclave', 'shannon', 'entropy', 'merkle', 'ledger',
      'vertex', 'sovereign', 'nebula', 'protocol', 'poly1305', 'lattice', 'synapse',

    ];

    function generateRandomPassword(length = 24, mode = 'random', wordCount = 5) {
      if (mode === 'passphrase') {
        const words = [];
        for (let i = 0; i < wordCount; i++) {
          words.push(WORDLIST[Math.floor(Math.random() * WORDLIST.length)]);
        }
        return words.join('-');
      }
      const pool = CHARSETS.uppercase + CHARSETS.lowercase + CHARSETS.numbers + CHARSETS.symbols;
      let res = '';
      for (let i = 0; i < length; i++) {
        res += pool[Math.floor(Math.random() * pool.length)];
      }
      return res;
    }

    function calculateEntropy(pass = '') {
      if (!pass) return { bits: 0, score: 0, label: 'EMPTY', color: 'text-outline', bgColor: 'bg-outline', crackTime: 'Instant' };
      let pool = 0;
      if (/[a-z]/.test(pass)) pool += 26;
      if (/[A-Z]/.test(pass)) pool += 26;
      if (/[0-9]/.test(pass)) pool += 10;
      if (/[^a-zA-Z0-9]/.test(pass)) pool += 33;
      if (pool === 0) pool = 1;
      const bits = Math.round(pass.length * Math.log2(pool) * 10) / 10;
      if (bits < 40) return { bits, score: 20, label: 'VERY WEAK', color: 'text-error', bgColor: 'bg-error', crackTime: 'Seconds' };
      if (bits < 60) return { bits, score: 45, label: 'MODERATE', color: 'text-tertiary', bgColor: 'bg-tertiary', crackTime: '3 Months' };
      if (bits < 90) return { bits, score: 80, label: 'STRONG', color: 'text-secondary', bgColor: 'bg-secondary', crackTime: '1,400 Centuries' };
      return { bits, score: 100, label: 'QUANTUM-RESISTANT', color: 'text-primary', bgColor: 'bg-primary', crackTime: '8.4 Billion Years' };
    }

    function getSimulatedTOTP(secretKey = 'JBSWY3DPEHPK3PXP') {
      const epoch = Math.floor(Date.now() / 1000);
      const step = 30;
      const counter = Math.floor(epoch / step);
      const remaining = step - (epoch % step);
      let hashVal = 0;
      const str = `${secretKey}:${counter}`;
      for (let i = 0; i < str.length; i++) {
        hashVal = (hashVal << 5) - hashVal + str.charCodeAt(i);
        hashVal |= 0;
      }
      const code = Math.abs(hashVal % 1000000).toString().padStart(6, '0');
      return { code, remaining };
    }

              <div className="w-full max-w-xl bg-surface-container-low border border-cyber-border-highlight rounded-xl shadow-2xl overflow-hidden flex flex-col text-left" onClick={e => e.stopPropagation()}>
                <div className="flex items-center gap-3 px-4 py-3 border-b border-cyber-border bg-surface-container-lowest">
                  <span className="material-symbols-outlined text-secondary text-xl">search</span>
                  <input
                    type="text"
                    autoFocus
                    placeholder="Type a command or search stored credentials..."
                    className="w-full bg-transparent text-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none"
                    onChange={e => setSearchTerm(e.target.value)}
                  />
                  <kbd className="font-mono-key text-[10px] text-on-surface-variant bg-surface-container px-2 py-0.5 rounded border border-cyber-border">ESC</kbd>
                </div>
                <div className="max-h-80 overflow-y-auto p-2 space-y-1">
                  <div onClick={() => { setActivePage('vault'); setIsCommandOpen(false); }} className="p-2.5 rounded-lg hover:bg-surface-container text-xs cursor-pointer flex items-center gap-2">
                    <span className="material-symbols-outlined text-sm text-primary">key</span>
                    <span>Go to Password Vault</span>
                  </div>
                  <div onClick={() => { setActivePage('generator'); setIsCommandOpen(false); }} className="p-2.5 rounded-lg hover:bg-surface-container text-xs cursor-pointer flex items-center gap-2">
                    <span className="material-symbols-outlined text-sm text-secondary">casino</span>
                    <span>Go to Password Generator</span>
                  </div>
                  <div onClick={() => { setActivePage('security'); setIsCommandOpen(false); }} className="p-2.5 rounded-lg hover:bg-surface-container text-xs cursor-pointer flex items-center gap-2">
                    <span className="material-symbols-outlined text-sm text-tertiary">security_update_good</span>
                    <span>Go to Security Health Center</span>
                  </div>
                  <div onClick={() => { setIsLocked(true); setIsCommandOpen(false); }} className="p-2.5 rounded-lg hover:bg-error/15 text-xs text-error cursor-pointer flex items-center gap-2">
                    <span className="material-symbols-outlined text-sm">lock</span>
                    <span>Lock Enclave Now</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Container */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-auto">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`flex items-center gap-2.5 px-4 py-3 rounded-lg border shadow-xl text-xs max-w-sm ${t.type === 'error'
                    ? 'bg-error-container/20 border-error/40 text-on-surface'
                    : t.type === 'warning'
                      ? 'bg-tertiary-container/20 border-tertiary/40 text-on-surface'
                      : 'bg-surface-container-high border-secondary/40 text-on-surface shadow-[0_0_12px_rgba(34,211,238,0.2)]'
                  }`}
              >
                <span className={`material-symbols-outlined text-base ${t.type === 'error' ? 'text-error' : t.type === 'warning' ? 'text-tertiary' : 'text-secondary'}`}>
                  {t.type === 'error' ? 'error' : t.type === 'warning' ? 'warning' : 'check_circle'}
                </span>
                <span className="font-medium flex-1">{t.msg}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
